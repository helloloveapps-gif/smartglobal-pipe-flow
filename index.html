<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수당 흐름 조직도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--paper:#F4F1EA;--ink:#0B1B33;--mute:#6B7280;--line:#D9D3C7;--card:#FFFFFF;--pipe:#2447F5;--match:#FF5A1F;--gen:#0B1B33}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,sans-serif}
main{max-width:1320px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute);font-size:14px;line-height:1.7}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.scroll{overflow-x:auto}
#info{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;min-height:64px}
.chip{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.5;min-width:150px}
.chip b{font-size:18px}
.chip small{display:block;color:var(--mute);font-size:12px}
.chip.sale{border-color:var(--ink)}
.chip.gen{border-style:dashed;border-color:var(--gen)}
.chip.pipe{border-color:var(--pipe);color:var(--pipe)}
.chip.match{border-color:var(--match);color:var(--match)}
.hint{color:var(--mute);font-size:14px;align-self:center}
svg .nd{cursor:pointer}
svg .nd circle{transition:none}
svg.act .ed{opacity:.25}
svg.act .ed.on{opacity:1}
svg .ed.on{stroke:var(--ink)!important;stroke-width:5}
@keyframes blinkP{0%,49%{fill:var(--pipe)}50%,100%{fill:#fff}}
@keyframes blinkM{0%,49%{fill:var(--match)}50%,100%{fill:#fff}}
.nd.pipe circle{stroke:var(--pipe)!important;stroke-width:5!important;animation:blinkP .5s steps(1) infinite}
.nd.match circle{stroke:var(--match)!important;stroke-width:5!important;animation:blinkM .5s steps(1) infinite}
.nd.pipe text.n,.nd.match text.n{animation:none}
.nd.gen circle{stroke:var(--gen)!important;stroke-width:4!important;stroke-dasharray:5 4}
.nd.sale circle{fill:var(--ink)!important;stroke:var(--ink)!important}
.nd.sale text.n{fill:#fff}
.tag{font-size:13px;font-weight:700}
.zoom{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:8px 0;background:var(--paper)}
.zoom button{font:inherit;font-size:16px;min-width:44px;height:36px;padding:0 12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
#zl{color:var(--mute);font-size:13px;margin-left:4px}
svg#tree{display:block}
@media (max-width:640px){
  main{padding:14px 12px 32px} h1{font-size:17px} p.sub{font-size:13px}
  .box{padding:10px} .chip{min-width:0;flex:1 1 45%;padding:6px 8px;font-size:12px} .chip b{font-size:15px}
}
</style>
</head>
<body>
<main>
<h1>수당 흐름 조직도 — 동그라미를 누르면 그 자리 매출의 수당이 어디로 가는지</h1>
<p class="sub">손글씨 보상플랜 그림을 가상 회원번호로 옮겼다. 추천인은 그림처럼 바로 위 자리 사람. 매출 1건 = 75,000원.<br>
줄은 누군가의 오른쪽(B) 자리에서 시작해 왼쪽으로만 내려간다. 그 B 자리 바로 위 사람이 <b>발생자</b>(받지 않음) → 발생자의 추천인 <b style="color:var(--pipe)">파이프수당</b> → 그 추천인 <b style="color:var(--match)">매칭수당</b>, 25,000원씩.</p>
<div class="box"><div id="info"><span class="hint">조직도의 동그라미를 누르세요.</span></div></div>
<div class="zoom"><button id="zo" aria-label="줄이기">−</button><button id="zf">맞춤</button><button id="zi" aria-label="키우기">+</button><span id="zl">맞춤</span></div>
<div class="box scroll"><svg id="tree" role="img" aria-label="수당 흐름 조직도"></svg></div>
</main>
<script>
const NAME = {
 "1":"나","1.1":"A1","1.2":"B1","1.1.1":"A2","1.1.2":"B","1.2.1":"A1","1.2.2":"B",
 "1.1.1.1":"A3","1.1.1.1.1":"A4","1.1.1.2":"B1","1.1.1.2.1":"A1",
 "1.1.2.1":"A1","1.1.2.1.1":"A2","1.1.2.2":"B","1.1.2.2.1":"A1",
 "1.2.1.1":"A2","1.2.1.1.1":"A3","1.2.1.1.1.1":"A4","1.2.1.2":"B","1.2.1.2.1":"A1","1.2.1.2.1.1":"A2",
 "1.2.2.1":"A1","1.2.2.1.1":"A2","1.2.2.1.1.1":"A3","1.2.2.2":"B","1.2.2.2.1":"A1","1.2.2.2.1.1":"A2"};
const GEN = {"1.1":"1대","1.2":"1대","1.1.1":"2대","1.1.2":"2대","1.2.1":"2대","1.2.2":"2대"};
const NO = {"1":10,"1.1":11,"1.2":12,"1.1.1":21,"1.1.2":22,"1.2.1":23,"1.2.2":24,
 "1.1.1.1":31,"1.1.1.2":32,"1.1.2.1":33,"1.1.2.2":34,"1.2.1.1":35,"1.2.1.2":36,"1.2.2.1":37,"1.2.2.2":38,
 "1.1.1.1.1":41,"1.1.1.2.1":42,"1.1.2.1.1":43,"1.1.2.2.1":44,"1.2.1.1.1":45,"1.2.1.2.1":46,"1.2.2.1.1":47,"1.2.2.2.1":48,
 "1.2.1.1.1.1":55,"1.2.1.2.1.1":56,"1.2.2.1.1.1":57,"1.2.2.2.1.1":58};
/* 전체 자리: 99 → (오른쪽) S2 2 → (오른쪽) S1 1 → (오른쪽) 나 10 */
const full = l => "U.2.2.2" + l.slice(1);
const ALL = {"U":{no:99,nm:"S2 의 추천인"},"U.2":{no:2,nm:"S2"},"U.2.2":{no:1,nm:"S1"}};
Object.keys(NAME).forEach(l => ALL[full(l)] = {no:NO[l], nm:NAME[l] + (GEN[l] ? " (" + GEN[l] + ")" : ""), loc:l});
const par = l => l && l.includes(".") ? l.slice(0, l.lastIndexOf(".")) : null;
const LINEC = {"1":"#9CA3AF","1.1.1.2":"#2447F5","1.1.2":"#12915A","1.1.2.2":"#7A3FE0","1.2":"#B8A88A","1.2.1.2":"#E8590C","1.2.2":"#C8102E","1.2.2.2":"#0E7490"};
const CIRC = {"1":"①","1.1.1.2":"②","1.1.2":"③","1.1.2.2":"④","1.2":"⑤","1.2.1.2":"⑥","1.2.2":"⑦","1.2.2.2":"⑧"};
const lineOf = l => { let q = l; while (q.endsWith(".1")) q = q.slice(0,-2); return q; };
const colorOf = l => LINEC[lineOf(l)] || "#B8B0A2";

/* 자리 좌표 */
const COL = {"1.1.1.1":0,"1.1.1.2":1,"1.1.2.1":2,"1.1.2.2":3,"1.2.1.1":4,"1.2.1.2":5,"1.2.2.1":6,"1.2.2.2":7};
const W = 140, H = 100, X0 = 40, Y0 = 220;
const locs = Object.keys(NAME), depth = l => l.split(".").length;
function xOf(l){
  if (depth(l) >= 4) return X0 + COL[l.split(".").slice(0,4).join(".")] * W;
  const k = Object.keys(COL).filter(c => c.startsWith(l + "."));
  return k.reduce((s,c) => s + X0 + COL[c]*W, 0) / k.length;
}
const P = {};
locs.forEach(l => P[full(l)] = {x: xOf(l) + W/2 - 20, y: Y0 + (depth(l)-1)*H});
const me = P["U.2.2.2"];
P["U.2.2"] = {x: me.x - 200, y: me.y - 70}; P["U.2"] = {x: me.x - 400, y: me.y - 120}; P["U"] = {x: Math.max(60, me.x - 570), y: me.y - 160};
const maxD = Math.max(...locs.map(depth));
const svgW = X0*2 + 8*W, svgH = Y0 + maxD*H + 70;
const svg = document.getElementById("tree");
svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
/* 크기 : 맞춤(화면 너비) 이 기본, − + 로 줄이고 키운다 */
let zoom = 0;	// 0 = 맞춤
const box = svg.parentElement, zl = document.getElementById("zl");
function applyZoom(){
  const fit = box.clientWidth - 32;
  const w = zoom ? Math.round(svgW * zoom) : Math.min(fit, svgW);
  svg.style.width = w + "px"; svg.style.height = Math.round(w * svgH / svgW) + "px";
  zl.textContent = zoom ? Math.round(zoom * 100) + "%" : "맞춤";
}
document.getElementById("zo").onclick = () => { zoom = Math.max(0.2, (zoom || (box.clientWidth - 32) / svgW) - 0.15); applyZoom(); };
document.getElementById("zi").onclick = () => { zoom = Math.min(2, (zoom || (box.clientWidth - 32) / svgW) + 0.15); applyZoom(); };
document.getElementById("zf").onclick = () => { zoom = 0; applyZoom(); };
window.addEventListener("resize", () => { if (!zoom) applyZoom(); });
const el = (t,a,i="") => `<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")}>${i}</${t}>`;
let out = "";
Object.keys(ALL).forEach(L => { const p = par(L); if (!p) return;
  const a = P[p], b = P[L], c = ALL[L].loc ? colorOf(ALL[L].loc) : "#B8B0A2";
  out += el("path",{class:"ed","data-l":L,d:`M${a.x} ${a.y} H${b.x} V${b.y}`,fill:"none",stroke:c,"stroke-width":3}); });
Object.keys(COL).forEach(k => {
  const last = locs.filter(l => l === k || l.startsWith(k + ".")).sort((a,b)=>depth(b)-depth(a))[0], p = P[full(last)];
  out += el("path",{d:`M${p.x} ${p.y} V${p.y+40}`,stroke:colorOf(k),"stroke-width":3,"stroke-dasharray":"4 4",fill:"none"});
  out += el("text",{x:p.x,y:p.y+60,"text-anchor":"middle","font-size":18,fill:colorOf(k)},"∞");
  out += el("text",{x:p.x,y:Y0+maxD*H+22,"text-anchor":"middle","font-size":22,"font-weight":700,fill:colorOf(k)},CIRC[lineOf(k)]);
});
Object.keys(ALL).forEach(L => {
  const p = P[L], r = ALL[L], big = L === "U.2.2.2", c = r.loc ? (big ? "#FF5A1F" : colorOf(r.loc)) : "#8A8A8A";
  out += `<g class="nd" data-l="${L}">` +
    el("circle",{cx:p.x,cy:p.y,r:big?25:21,fill:"#fff",stroke:c,"stroke-width":big?4:2.5}) +
    el("text",{class:"n",x:p.x,y:p.y+6,"text-anchor":"middle","font-size":big?17:15,"font-weight":800,fill:"#0B1B33"},r.no) +
    el("text",{x:p.x,y:p.y+(big?42:37),"text-anchor":"middle","font-size":11,fill:"#6B7280"},r.nm) +
    el("text",{class:"tag",x:p.x+28,y:p.y-16,fill:"#0B1B33"},"") + `</g>`;
});
svg.innerHTML = out;

const nd = L => svg.querySelector(`.nd[data-l="${L}"]`);
function pick(L){
  svg.querySelectorAll(".nd").forEach(g => { g.classList.remove("sale","gen","pipe","match"); g.querySelector(".tag").textContent = ""; });
  svg.querySelectorAll(".ed").forEach(e => e.classList.remove("on"));
  svg.classList.add("act");
  let q = L; while (q.endsWith(".1")) q = q.slice(0,-2);
  const x = q.endsWith(".2") ? par(q) : null, p = par(x), m = par(p);
  const top = m || p || x || L;
  for (let c = L; c && c !== top; c = par(c)) { const e = svg.querySelector(`.ed[data-l="${c}"]`); if (e) e.classList.add("on"); }
  nd(L).classList.add("sale");
  const tag = (l, t, col) => { const g = nd(l); g.querySelector(".tag").textContent = t; g.querySelector(".tag").setAttribute("fill", col); };
  const info = document.getElementById("info"), who = l => l ? `${ALL[l].no} <small>${ALL[l].nm}</small>` : "없음 <small>위에 사람이 없다</small>";
  let html = `<div class="chip sale"><small>매출 (75,000원)</small><b>${who(L)}</b></div>`;
  if (!x) {
    html += `<div class="chip"><small>결과</small>이 줄은 맨 위까지 이어져 줄 주인이 없다 → 수당 없음</div>`;
  } else {
    nd(x).classList.add("gen"); tag(x, "발생", "#0B1B33");
    html += `<div class="chip gen"><small>발생자 — 줄 주인(안 받음)</small><b>${who(x)}</b></div>`;
    if (p) { nd(p).classList.add("pipe"); tag(p, "파이프 25,000", "#2447F5"); }
    html += `<div class="chip pipe"><small>파이프수당 25,000 — 발생자의 추천인</small><b>${who(p)}</b></div>`;
    if (m) { nd(m).classList.add("match"); tag(m, "매칭 25,000", "#FF5A1F"); }
    html += `<div class="chip match"><small>매칭수당 25,000 — 그 추천인</small><b>${who(m)}</b></div>`;
  }
  info.innerHTML = html;
}
svg.querySelectorAll(".nd").forEach(g => g.addEventListener("click", () => pick(g.dataset.l)));
applyZoom();
</script>
</body>
</html>
